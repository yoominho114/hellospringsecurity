<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .error-card { border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        .error-code { font-size: 4rem; font-weight: 800; color: #e94560; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <div class="ms-auto">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card error-card p-5 text-center">
                <div class="error-code">403</div>
                <h3 class="fw-bold mb-3">접근 권한이 없습니다</h3>
                <p class="text-muted mb-4">이 페이지는 관리자 권한이 있는 사용자만 접근할 수 있습니다.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/home}" class="btn btn-primary">홈으로</a>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">상품 목록</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 py-3 text-center bg-dark text-white border-top border-danger border-3">
    <p class="mb-0 fw-bold"
       th:text="${'실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss') + ' │ 학번: 2371463 │ 성명: 유민호'}"></p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
